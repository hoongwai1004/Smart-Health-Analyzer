<script>
(() => {
  let theme = 'light';
  try {
    const saved = localStorage.getItem('sha-theme');
    theme = (saved === 'light' || saved === 'dark')
      ? saved

try {
  const savedLang = localStorage.getItem('sha-lang');
  if (savedLang === 'zh' || savedLang === 'en') state.lang = savedLang;
} catch {}

/* ============================================================
 * § 5  工具函数
 * ============================================================ */
const fmt1 = n => n.toFixed(1);
const fmtRange = (a, b) => `${Number.isInteger(a) ? a : fmt1(a)} – ${Number.isInteger(b) ? b : fmt1(b)}`;
const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, key) => vars[key] ?? '');
const haptic = (pattern = 8) => { try { navigator.vibrate?.(pattern); } catch {} };
const shake = el => el.animate(
  [{ translate: '0' }, { translate: '-4px' }, { translate: '4px' }, { translate: '0' }],
  { duration: 280, easing: 'ease-in-out' }
);

/* ============================================================
 * § 6  业务计算（查表 + 线性插值）
 * ============================================================ */

/**
 * 根据身高和性别获取标准体重区间（kg）
 * 数据来自 WEIGHT_TABLE，支持身高小数（线性插值）
 * @param {number} heightCm 身高（cm）
 * @param {string} gender 'female' | 'male'
 * @returns {[number, number]} [下限, 上限]
 */
function idealWeightRange(heightCm, gender) {
  const h = Math.min(190, Math.max(140, heightCm));
  const h1 = Math.floor(h);
  const h2 = Math.ceil(h);
  const t = h - h1;

  const row1 = WEIGHT_TABLE[h1];
  const row2 = WEIGHT_TABLE[h2];
  if (!row1 || !row2) return [0, 0];

  const key = gender === 'female' ? 'f' : 'm';
  const [min1, max1] = row1[key];
  const [min2, max2] = row2[key];

  const min = min1 + (min2 - min1) * t;
  const max = max1 + (max2 - max1) * t;

  return [min, max];
}

function bmiCategory(bmi) {
  if (bmi < CONFIG.cdc.under) return 'under';
  if (bmi < CONFIG.cdc.over)  return 'normal';
  if (bmi < CONFIG.cdc.obese) return 'over';
  return 'obese';
}

function analyze({ gender, height, weight, bodyfat, muscle }) {
  const [idealMin, idealMax] = idealWeightRange(height, gender);
  const bmi = weight / (height / 100) ** 2;
  const mode = weight < idealMin ? 'gain' : weight > idealMax ? 'lose' : 'ok';
  const diff = mode === 'gain' ? idealMin - weight : mode === 'lose' ? weight - idealMax : 0;
  const months = diff > 0 ? Math.ceil(diff / CONFIG.ratePerMonth) : 0;
  return {
    weight, mode, diff, months, weeks: months * 4,
    idealMin, idealMax, bmi, bmiCat: bmiCategory(bmi),
    fatMass: weight * bodyfat / 100,
    muscleRatio: muscle / weight * 100,
  };
}

/* ============================================================
 * § 7  表单校验
 * ============================================================ */
function syncForm() {
  const v = state.values;
  if (!v) return;
  const genderRadio = $(`input[name=gender][value=${v.gender}]`);
  if (genderRadio) genderRadio.checked = true;
  dom.height.value = v.height;
  dom.weight.value = v.weight;
  dom.bodyfat.value = v.bodyfat;
  dom.muscle.value = v.muscle;
}

function showError(key, input) {
  dom.err.textContent = I18N[state.lang][key] ?? key;
  dom.err.hidden = false;
  shake(dom.err);
  haptic([20, 40, 20]);
  if (input) {
    input.classList.add('bad');
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function clearErrors() {
  dom.err.hidden = true;
  for (const key of FIELD_ORDER) {
    const input = fieldInputs[key];
    input.classList.remove('bad');
    input.removeAttribute('aria-invalid');
  }
}

function readForm() {
  clearErrors();
  const values = {};
  for (const key of FIELD_ORDER) {
    const input = fieldInputs[key];
    const meta = FIELD_META[key];
    const num = parseFloat(input.value);
    values[key] = num;
    if (!Number.isFinite(num) || !meta.valid(num)) {
      showError(`err_${key}`, input);
      return null;
    }
  }
  if (values.muscle >= values.weight) {
    showError('err_muscle_big', dom.muscle);
    return null;
  }
  values.gender = $('input[name=gender]:checked').value;
  return values;
}

/* ============================================================
 * § 8  结果渲染
 * ============================================================ */
function render() {
  const r = state.result;
  if (!r) return;
  const t = I18N[state.lang];

  dom.bh.dataset.cat = r.bmiCat;
  dom.bhn.textContent = fmt1(r.bmi);
  dom.bhc.textContent = t[`bmi_${r.bmiCat}`];
  dom.bhr.textContent = t[`bmi_range_${r.bmiCat}`];

  const [scaleMin, scaleMax] = CONFIG.bmiScale;
  const bmiPercent = Math.min(97, Math.max(3, (r.bmi - scaleMin) / (scaleMax - scaleMin) * 100));
  dom.bsm.style.left = `${bmiPercent}%`;

  dom.sts.dataset.s = r.mode;
  dom.stt.textContent = t[`status_${r.mode}`];
  dom.stsub.textContent = fill(t[`status_${r.mode}_sub`], { w: fmt1(r.weight), d: fmt1(r.diff) });

  if (r.mode === 'ok') {
    dom.std.hidden = true;
  } else {
    dom.std.hidden = false;
    dom.stdn.textContent = fmt1(r.diff);
    dom.stdu.textContent = 'kg';
  }

  const span = Math.max(r.idealMax - r.idealMin, 4);
  const pad = span * 1.2;
  const railMin = Math.max(0, r.idealMin - pad);
  const railMax = r.idealMax + pad;
  const railTotal = railMax - railMin;
  const toPercent = v => (v - railMin) / railTotal * 100;

  dom.rb.style.left  = `${toPercent(r.idealMin)}%`;
  dom.rb.style.width = `${toPercent(r.idealMax) - toPercent(r.idealMin)}%`;
  dom.rm.style.left  = `${Math.min(97, Math.max(3, toPercent(r.weight)))}%`;

  dom.cw.textContent   = fmt1(r.weight);
  dom.smin.textContent = `${Math.round(railMin)} kg`;
  dom.smax.textContent = `${Math.round(railMax)} kg`;

  dom.fm.textContent = fmt1(r.fatMass);
  dom.mr.textContent = fmt1(r.muscleRatio);
  dom.ir.textContent = `${fmt1(r.idealMin)} – ${fmt1(r.idealMax)}`;

  dom.tc.dataset.s = r.mode;
  if (r.mode === 'ok') {
    dom.tv.textContent = '—';
    dom.tu.textContent = '';
    dom.ts.textContent = t.time_ok;
  } else {
    dom.tv.textContent = String(r.months);
    dom.tu.textContent = t.time_unit_months;
    dom.ts.textContent = fill(t.time_sub_weeks, { weeks: r.weeks });
  }
}

function updateVisibility() {
  const hasResult = !!state.result;
  dom.empty.hidden = hasResult;
  dom.stack.hidden = !hasResult;
  dom.sbar.hidden  = !hasResult;
}

function pulseCard(field) {
  const card = field === 'bodyfat' ? dom.cf : field === 'muscle' ? dom.cm : field === 'weight' ? dom.ci : null;
  if (!card) return;
  card.classList.remove('pulse');
  void card.offsetWidth;
  card.classList.add('pulse');
}

/* ============================================================
 * § 9  数据胶囊条 & 内联编辑
 * ============================================================ */
function chipContentHTML(field) {
  const t = I18N[state.lang];
  const v = state.values;
  if (field === 'gender') {
    const isFemale = v.gender === 'female';
    return `<span class="ci">${isFemale ? '♀' : '♂'}</span>
      <span class="cl">${t.lbl_gender}</span>
      <span class="cv">${isFemale ? t.lbl_female : t.lbl_male}</span>`;
  }
  const meta = FIELD_META[field];
  return `<span class="cl">${t[meta.i18n]}</span>
    <span class="cv">${fmt1(v[field])}</span>
    <span class="cu">${meta.unit}</span>`;
}

function renderChip(chip, field) {
  chip.classList.remove('edit');
  chip.innerHTML = chipContentHTML(field);
  chip.setAttribute('role', 'button');
  chip.setAttribute('tabindex', '0');
  const t = I18N[state.lang];
  if (field === 'gender') {
    const label = state.values.gender === 'female' ? t.lbl_female : t.lbl_male;
    chip.setAttribute('aria-label', `${t.lbl_gender}: ${label}`);
  } else {
    const meta = FIELD_META[field];
    chip.setAttribute('aria-label', `${t[meta.i18n]}: ${fmt1(state.values[field])} ${meta.unit}`);
  }
}

function buildChipBar() {
  if (!state.values) {
    dom.sbar.replaceChildren();
    dom.sbar.hidden = true;
    return;
  }
  const t = I18N[state.lang];
  const frag = document.createDocumentFragment();

  const hint = document.createElement('p');
  hint.className = 'shint';
  hint.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg><span>${t.edit_hint}</span>`;
  frag.append(hint);

  for (const field of ['gender', ...FIELD_ORDER]) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.dataset.f = field;
    renderChip(chip, field);
    frag.append(chip);
  }

  const editAll = document.createElement('span');
  editAll.className = 'chip act';
  editAll.dataset.a = 'edit';
  editAll.setAttribute('role', 'button');
  editAll.setAttribute('tabindex', '0');
  editAll.setAttribute('aria-label', t.btn_edit_full);
  editAll.innerHTML = `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>${t.btn_edit_full}</span>`;
  frag.append(editAll);

  dom.sbar.replaceChildren(frag);
  dom.sbar.hidden = false;
}

function openEditor(chip, field) {
  if (chip.classList.contains('edit')) return;
  const t = I18N[state.lang];
  const meta = FIELD_META[field];
  const current = state.values[field];

  chip.classList.add('edit');
  chip.removeAttribute('role');
  chip.removeAttribute('tabindex');
  chip.setAttribute('aria-label', `${t[meta.i18n]}: ${current} ${meta.unit}`);

  chip.innerHTML = `
    <div class="ed" role="group">
      <div class="edh">
        <span class="edl">${t[meta.i18n]}</span>
        <span class="edr">${fmtRange(meta.min, meta.max)} ${meta.unit}</span>
      </div>
      <div class="edf">
        <button type="button" class="eds" data-s="-1" aria-label="Decrease">−</button>
        <input class="edi" type="number" inputmode="decimal" step="${meta.step}" min="${meta.min}" max="${meta.max}" value="${current}" aria-label="${t[meta.i18n]}">
        <span class="edu">${meta.unit}</span>
        <button type="button" class="eds" data-s="1" aria-label="Increase">+</button>
      </div>
      <p class="ede" hidden></p>
      <div class="eda">
        <button type="button" class="edb g" data-a="cancel">${t.btn_cancel}</button>
        <button type="button" class="edb p" data-a="confirm">${t.btn_confirm}</button>
      </div>
    </div>`;

  const input = chip.querySelector('.edi');
  const errEl = chip.querySelector('.ede');
  requestAnimationFrame(() => { input.focus(); input.select(); });
  let settled = false;

  const validate = () => {
    const num = parseFloat(input.value);
    if (!Number.isFinite(num) || !meta.valid(num)) {
      errEl.textContent = fill(t.err_range, { min: meta.min, max: meta.max, unit: meta.unit });
      errEl.hidden = false;
      input.classList.add('bad');
      shake(chip);
      haptic([20, 30, 20]);
      return null;
    }
    if (field === 'muscle' && num >= state.values.weight) {
      errEl.textContent = t.err_muscle_big;
      errEl.hidden = false;
      input.classList.add('bad');
      shake(chip);
      haptic([20, 30, 20]);
      return null;
    }
    errEl.hidden = true;
    input.classList.remove('bad');
    return num;
  };

  const commit = () => {
    if (settled) return false;
    const num = validate();
    if (num == null) return false;
    settled = true;
    state.values = { ...state.values, [field]: num };
    syncForm();
    state.result = analyze(state.values);
    render();
    renderChip(dom.sbar.querySelector(`.chip[data-f="${field}"]`), field);
    pulseCard(field);
    haptic(10);
    return true;
  };

  const cancel = () => {
    if (settled) return;
    settled = true;
    renderChip(chip, field);
    haptic(6);
  };

  chip.querySelector('[data-a=confirm]').addEventListener('click', commit);
  chip.querySelector('[data-a=cancel]').addEventListener('click', cancel);

  chip.querySelectorAll('.eds').forEach(btn => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.s);
      const step = meta.step || 1;
      const currentVal = parseFloat(input.value);
      const base = Number.isFinite(currentVal) ? currentVal : 0;
      let next = base + delta * step;
      next = Math.round(next * 100) / 100;
      next = Math.min(meta.max, Math.max(meta.min, next));
      input.value = String(next);
      input.classList.remove('bad');
      errEl.hidden = true;
      haptic(5);
    });
  });

  input.addEventListener('input', () => { input.classList.remove('bad'); errEl.hidden = true; });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });

  const onOutside = e => {
    if (!chip.contains(e.target)) {
      cancel();
      document.removeEventListener('pointerdown', onOutside, true);
    }
  };
  setTimeout(() => document.addEventListener('pointerdown', onOutside, true), 0);
}

function activateChip(chip) {
  if (!chip) return;
  if (chip.dataset.a === 'edit') { haptic(); goToView('input', true); return; }
  const field = chip.dataset.f;
  if (!field) return;
  if (field === 'gender') {
    haptic();
    state.values = { ...state.values, gender: state.values.gender === 'female' ? 'male' : 'female' };
    syncForm();
    state.result = analyze(state.values);
    render();
    renderChip(chip, 'gender');
    haptic(8);
    return;
  }
  openEditor(chip, field);
}

/* ============================================================
 * § 10  视图 / 主题 / 语言
 * ============================================================ */
function goToView(view, smooth = false) {
  if (view === state.view) return;
  scrollMemory[state.view] = dom.body.scrollTop;
  state.view = view;
  for (const section of $$('.view')) section.hidden = section.dataset.v !== view;
  for (const tab of $$('.tab')) {
    const active = tab.dataset.t === view;
    tab.classList.toggle('on', active);
    tab.setAttribute('aria-selected', String(active));
  }
  dom.badge.hidden = !(state.result && view !== 'results');
  dom.body.scrollTo({ top: scrollMemory[view] ?? 0, behavior: smooth ? 'smooth' : 'instant' });
}

function syncThemeMeta() {
  const t = I18N[state.lang];
  const label = state.theme === 'dark' ? t.theme_light : t.theme_dark;
  dom.theme.setAttribute('aria-label', label);
  dom.theme.setAttribute('aria-pressed', String(state.theme === 'dark'));
  const meta = $('meta[name=theme-color]');
  if (meta) meta.content = state.theme === 'dark' ? '#0b1220' : '#10b981';
}

function applyI18n() {
  const t = I18N[state.lang];
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';
  for (const el of $$('[data-i]')) {
    const text = t[el.dataset.i];
    if (text != null) el.textContent = text;
  }
  for (const el of $$('[data-ph]')) {
    const text = t[el.dataset.ph];
    if (text != null) el.placeholder = text;
  }
  syncThemeMeta();
  if (state.values) buildChipBar();
}

function setLang(lang) {
  if (lang === state.lang) return;
  state.lang = lang;
  try { localStorage.setItem('sha-lang', lang); } catch {}
  applyI18n();
  if (state.result) render();
}

function setTheme(theme) {
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('sha-theme', theme); } catch {}
  syncThemeMeta();
}

/* ============================================================
 * § 11  事件绑定
 * ============================================================ */
dom.form.addEventListener('submit', e => {
  e.preventDefault();
  const values = readForm();
  if (!values) return;
  state.values = values;
  state.result = analyze(values);
  buildChipBar();
  render();
  updateVisibility();
  goToView('results', true);
  haptic(12);
});

function clearAll() {
  document.activeElement?.blur?.();
  for (const key of FIELD_ORDER) fieldInputs[key].value = '';
  $('input[name=gender][value=female]').checked = true;
  clearErrors();
  state.values = null;
  state.result = null;
  dom.sbar.replaceChildren();
  dom.sbar.hidden = true;
  updateVisibility();
  dom.badge.hidden = true;
  goToView('input', true);
  haptic(10);
}
dom.clear.addEventListener('click', clearAll);

dom.sbar.addEventListener('click', e => {
  if (e.target.closest('.ed')) return;
  const chip = e.target.closest('.chip');
  if (chip) activateChip(chip);
});

dom.sbar.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const chip = e.target.closest('.chip');
  if (!chip || e.target.closest('.ed')) return;
  e.preventDefault();
  activateChip(chip);
});

dom.lang.addEventListener('click', () => { haptic(); setLang(state.lang === 'zh' ? 'en' : 'zh'); });
dom.theme.addEventListener('click', () => { haptic(); setTheme(state.theme === 'dark' ? 'light' : 'dark'); });

for (const tab of $$('.tab')) {
  tab.addEventListener('click', () => { haptic(); goToView(tab.dataset.t); });
}

for (const key of FIELD_ORDER) {
  const input = fieldInputs[key];
  input.addEventListener('input', () => {
    input.classList.remove('bad');
    input.removeAttribute('aria-invalid');
    dom.err.hidden = true;
  });
}

dom.body.addEventListener('scroll', () => {
  dom.bar.classList.toggle('sc', dom.body.scrollTop > 4);
}, { passive: true });

/* ============================================================
 * § 12  初始化
 * ============================================================ */
syncThemeMeta();
applyI18n();
updateVisibility();
goToView('input');
</script>
</body>
</html>
