<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="description" content="输入身高、体重、体脂率与肌肉量，快速评估体重状态与达标时间。">
<title>智能健康分析助手 · Smart Health Analyzer</title>

<!-- Apply saved theme before first paint to avoid flash -->
<script>
(function () {
  var t = 'light';
  try {
    var s = localStorage.getItem('sha-theme');
    if (s === 'light' || s === 'dark') t = s;
    else if (matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>
/* =========================================================
   1. Design tokens
   ========================================================= */
:root{
  color-scheme: light;

  --bg:      #eef1f6;  --card:    #ffffff;  --card-2: #f6f8fb;
  --line:    #e4e9f0;  --text:    #0f172a;  --muted:  #64748b;

  --brand:       #10b981;  --brand-solid: #10b981;  --brand-ink:  #047857;
  --brand-soft:  #e8f8f1;  --brand-ring:  rgba(16,185,129,.18);
  --brand-glow:  rgba(16,185,129,.35);

  --danger:      #ef4444;  --danger-ink:  #b91c1c;  --danger-soft: #fee2e2;
  --danger-ring: rgba(239,68,68,.15);

  --info-ink:    #1d4ed8;  --info-soft:   #dbeafe;
  --violet-ink:  #6d28d9;  --violet-soft: #ede9fe;
  --amber-ink:   #b45309;  --amber-soft:  #fef3c7;
  --cyan-ink:    #0e7490;  --cyan-soft:   #cffafe;

  --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
  --shadow:    0 1px 2px rgba(15,23,42,.04), 0 10px 30px -14px rgba(15,23,42,.22);

  --r-lg: 20px;  --r-md: 14px;  --r-sm: 11px;
  --ease: cubic-bezier(.22,1,.36,1);
}

:root[data-theme="dark"]{
  color-scheme: dark;

  --bg:      #0b1220;  --card:    #131c2b;  --card-2: #1a2434;
  --line:    #26324a;  --text:    #e9eef7;  --muted:  #93a3b8;

  --brand:       #34d399;  --brand-solid: #059669;  --brand-ink:  #6ee7b7;
  --brand-soft:  #0c2b22;  --brand-ring:  rgba(52,211,153,.20);
  --brand-glow:  rgba(5,150,105,.45);

  --danger:      #f87171;  --danger-ink:  #fca5a5;  --danger-soft: #3a1416;
  --danger-ring: rgba(248,113,113,.20);

  --info-ink:    #93c5fd;  --info-soft:   #13233d;
  --violet-ink:  #c4b5fd;  --violet-soft: #241a3d;
  --amber-ink:   #fcd34d;  --amber-soft:  #3a2a0a;
  --cyan-ink:    #67e8f9;  --cyan-soft:   #0a2b33;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.40);
  --shadow:    0 1px 2px rgba(0,0,0,.40), 0 12px 32px -16px rgba(0,0,0,.70);
}

/* =========================================================
   2. Base
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
              "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  min-height:100dvh;
  padding:20px 16px 56px;
  transition:background .25s ease, color .25s ease;
}
[hidden]{display:none !important}

/* Shared transitions on theme-aware surfaces */
.panel, .segmented, .theme-toggle, .input-wrap input,
.range-track, .status, .metric {
  transition:background .25s ease, border-color .25s ease,
             color .25s ease, box-shadow .25s ease;
}

/* =========================================================
   3. App shell
   ========================================================= */
.app{max-width:470px;margin:0 auto}

.app-header{
  display:flex;flex-direction:column;gap:16px;
  margin-bottom:18px;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{
  flex:none;width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#34d399,#059669);
  box-shadow:0 6px 16px -6px var(--brand-glow);
}
.brand-mark svg{width:23px;height:23px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.brand p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4}

.header-controls{display:flex;gap:10px;align-items:center;width:100%}
.lang-switch{flex:1 1 auto;min-width:0}

/* =========================================================
   4. Segmented control
   ========================================================= */
.segmented{
  display:flex;gap:4px;padding:4px;
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:var(--r-md);
}
.seg-btn{
  position:relative;flex:1 1 0;min-width:0;
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 12px;
  border:0;border-radius:10px;background:transparent;
  color:var(--muted);font:inherit;font-size:14px;font-weight:700;
  cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  transition:background .18s ease, color .18s ease, box-shadow .18s ease;
}
.seg-btn input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-btn:hover{color:var(--text)}
.seg-btn.is-active,
.seg-btn:has(input:checked){
  background:var(--brand-soft);
  color:var(--brand-ink);
  box-shadow:inset 0 0 0 1.5px var(--brand);
}

/* =========================================================
   5. Theme toggle
   ========================================================= */
.theme-toggle{
  flex:0 0 auto;
  display:inline-grid;place-items:center;
  width:44px;height:44px;padding:0;
  border:1px solid var(--line);
  border-radius:var(--r-md);
  background:var(--card-2);
  color:var(--muted);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .18s ease, color .18s ease,
             border-color .18s ease, transform .18s ease;
}
.theme-toggle:hover{
  color:var(--brand-ink);
  border-color:var(--brand);
  background:var(--brand-soft);
}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle:focus-visible{outline:none;box-shadow:0 0 0 4px var(--brand-ring)}
.theme-toggle svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.theme-toggle .icon-sun{display:none}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:block}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* =========================================================
   6. Layout & panels
   ========================================================= */
.layout{display:grid;gap:16px}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:20px;
}

/* =========================================================
   7. Form
   ========================================================= */
.form{display:flex;flex-direction:column;gap:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}

.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field-label{
  display:flex;align-items:baseline;gap:6px;
  font-size:13.5px;font-weight:700;color:var(--text);
}
.hint{font-size:11.5px;font-weight:600;color:var(--muted);opacity:.85}

.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{
  width:100%;min-width:0;
  padding:13px 44px 13px 14px;
  font:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;
  color:var(--text);
  background:var(--card-2);
  border:1.5px solid var(--line);
  border-radius:var(--r-sm);
  -moz-appearance:textfield;
  scroll-margin:24px;
}
.input-wrap input::-webkit-outer-spin-button,
.input-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.input-wrap input::placeholder{font-weight:500;color:var(--muted);opacity:.7}
.input-wrap input:focus{
  outline:none;background:var(--card);
  border-color:var(--brand);
  box-shadow:0 0 0 4px var(--brand-ring);
}
.input-wrap input.is-invalid{
  border-color:var(--danger);
  box-shadow:0 0 0 4px var(--danger-ring);
}
.unit{
  position:absolute;right:14px;
  font-size:12.5px;font-weight:700;color:var(--muted);
  pointer-events:none;
}

.form-error{
  margin:0;padding:11px 13px;
  font-size:13.5px;font-weight:600;line-height:1.45;
  color:var(--danger-ink);background:var(--danger-soft);
  border-radius:var(--r-sm);
}
.form-error.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}

/* =========================================================
   8. Buttons
   ========================================================= */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.btn{
  width:100%;padding:15px 18px;
  border:1.5px solid transparent;border-radius:var(--r-sm);
  font:inherit;font-size:16px;font-weight:800;letter-spacing:.01em;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .16s ease, background .18s ease, box-shadow .18s ease,
             color .18s ease, border-color .18s ease, filter .18s ease;
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-primary{
  background:var(--brand-solid);color:#fff;
  box-shadow:0 8px 20px -10px var(--brand-glow);
}
.btn-primary:hover{
  filter:brightness(1.07);transform:translateY(-1px);
  box-shadow:0 12px 24px -10px var(--brand-glow);
}
.btn-primary:active{filter:brightness(.95);transform:translateY(0)}
.btn-ghost{
  background:transparent;color:var(--muted);
  border-color:var(--line);
}
.btn-ghost:hover{
  color:var(--danger-ink);
  border-color:var(--danger);
  background:var(--danger-soft);
}

/* =========================================================
   9. Empty state
   ========================================================= */
.empty-panel{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:38px 24px;color:var(--muted);
}
.empty-panel svg{width:38px;height:38px;opacity:.45}
.empty-panel p{margin:0;font-size:14px;font-weight:600;line-height:1.55;max-width:250px}

/* =========================================================
   10. Results
   ========================================================= */
.result-panel{scroll-margin-top:16px;animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- BMI hero ---------- */
.bmi-hero{
  padding:18px 18px 14px;
  border-radius:var(--r-md);
  margin-bottom:16px;
  transition:background .3s ease, color .3s ease;
}
.bmi-hero[data-cat="under"] {background:var(--cyan-soft);  color:var(--cyan-ink)}
.bmi-hero[data-cat="normal"]{background:var(--brand-soft); color:var(--brand-ink)}
.bmi-hero[data-cat="over"]  {background:var(--amber-soft); color:var(--amber-ink)}
.bmi-hero[data-cat="obese"] {background:var(--danger-soft);color:var(--danger-ink)}

.bmi-hero-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:14px;margin-bottom:16px;
}
.bmi-hero-value{display:flex;flex-direction:column;gap:2px;min-width:0}
.bmi-hero-label{
  font-size:10.5px;font-weight:800;letter-spacing:.10em;
  text-transform:uppercase;opacity:.85;
}
.bmi-hero-number{
  font-size:46px;font-weight:900;line-height:1;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;
}
.bmi-hero-cat{
  display:flex;flex-direction:column;align-items:flex-end;
  gap:2px;text-align:right;padding-bottom:4px;
}
.bmi-hero-cat strong{font-size:17px;font-weight:800;letter-spacing:-.015em}
.bmi-hero-cat span{
  font-size:11.5px;font-weight:700;opacity:.8;
  font-variant-numeric:tabular-nums;
}

.bmi-scale-track{
  position:relative;display:flex;height:9px;border-radius:999px;
}
.bmi-seg{height:100%}
.bmi-seg:first-child{border-radius:999px 0 0 999px}
.bmi-seg:last-child {border-radius:0 999px 999px 0}
.bmi-seg--under {flex:4.5;background:var(--cyan-ink);   opacity:.38}
.bmi-seg--normal{flex:6.5;background:var(--brand-ink);  opacity:.55}
.bmi-seg--over  {flex:5;  background:var(--amber-ink);  opacity:.50}
.bmi-seg--obese {flex:10; background:var(--danger-ink); opacity:.48}

.bmi-scale-marker{
  position:absolute;top:50%;left:50%;
  width:16px;height:16px;
  border-radius:50%;
  background:currentColor;
  border:3px solid var(--card);
  transform:translate(-50%,-50%);
  box-shadow:0 2px 8px rgba(0,0,0,.28);
  z-index:2;
  transition:left .6s var(--ease);
}
.bmi-scale-labels{
  display:flex;margin-top:8px;
  font-size:10.5px;font-weight:800;
  letter-spacing:.01em;opacity:.82;
}
.bmi-scale-labels span{
  text-align:center;white-space:nowrap;overflow:hidden;
}
.bmi-scale-labels span:nth-child(1){flex:4.5}
.bmi-scale-labels span:nth-child(2){flex:6.5}
.bmi-scale-labels span:nth-child(3){flex:5}
.bmi-scale-labels span:nth-child(4){flex:10}

/* ---------- Status banner ---------- */
.status{
  display:flex;align-items:center;gap:13px;
  padding:15px;border-radius:var(--r-md);
  border:1.5px solid transparent;
}
.status[data-state="lose"]{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-ring)}
.status[data-state="gain"]{background:var(--info-soft);  color:var(--info-ink);  border-color:transparent}
.status[data-state="ok"]  {background:var(--brand-soft); color:var(--brand-ink); border-color:var(--brand-ring)}

.status-icon{
  flex:none;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:currentColor;
}
.status-icon svg{
  width:19px;height:19px;
  stroke:var(--card);stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;fill:none;
}
.status-icon path{display:none}
.status[data-state="lose"] .ico-lose,
.status[data-state="gain"] .ico-gain,
.status[data-state="ok"]   .ico-ok{display:block}

.status-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.status-text strong{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.status-text span{font-size:12.5px;font-weight:600;opacity:.9;line-height:1.4}

/* ---------- Weight range bar ---------- */
.range{margin-top:20px}
.range-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;margin-bottom:10px;
}
.range-title{
  font-size:12px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
.range-current{
  font-size:13.5px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.range-track{
  position:relative;height:10px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--line);
}
.range-band{
  position:absolute;top:0;bottom:0;border-radius:999px;
  background:var(--brand);opacity:.32;
}
.range-marker{
  position:absolute;top:50%;left:50%;
  width:18px;height:18px;border-radius:50%;
  background:var(--card);
  border:3.5px solid var(--brand);
  transform:translate(-50%,-50%);
  box-shadow:0 2px 8px rgba(0,0,0,.18);
  transition:left .55s var(--ease);
}
.range-scale{
  display:flex;justify-content:space-between;margin-top:8px;
  font-size:11.5px;font-weight:700;color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* ---------- Metric tiles ---------- */
.metrics{
  display:grid;grid-template-columns:1fr 1fr;
  gap:11px;margin-top:20px;
}
.metric{
  display:flex;flex-direction:column;gap:5px;
  padding:14px;border-radius:var(--r-md);
  background:var(--card-2);border:1.5px solid var(--line);
  min-width:0;
}
.metric--wide{grid-column:span 2}
.metric-label{
  font-size:11.5px;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);
}
.metric-value{
  font-size:27px;font-weight:900;line-height:1.05;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:3px;flex-wrap:wrap;
}
.metric-unit{font-size:13px;font-weight:700;opacity:.6}
.metric-sub{font-size:11.5px;font-weight:700;opacity:.72;margin-top:1px}

.metric--violet{background:var(--violet-soft);border-color:transparent}
.metric--violet .metric-label,.metric--violet .metric-value{color:var(--violet-ink)}
.metric--cyan{background:var(--cyan-soft);border-color:transparent}
.metric--cyan .metric-label,.metric--cyan .metric-value{color:var(--cyan-ink)}
.metric--amber{background:var(--amber-soft);border-color:transparent}
.metric--amber .metric-label,.metric--amber .metric-value{color:var(--amber-ink)}

#timeCard[data-state="lose"]{background:var(--danger-soft);border-color:transparent}
#timeCard[data-state="lose"] .metric-label,#timeCard[data-state="lose"] .metric-value{color:var(--danger-ink)}
#timeCard[data-state="gain"]{background:var(--info-soft);border-color:transparent}
#timeCard[data-state="gain"] .metric-label,#timeCard[data-state="gain"] .metric-value{color:var(--info-ink)}
#timeCard[data-state="ok"]{background:var(--brand-soft);border-color:transparent}
#timeCard[data-state="ok"] .metric-label,#timeCard[data-state="ok"] .metric-value{color:var(--brand-ink)}

/* =========================================================
   11. Responsive
   ========================================================= */
@media (max-width:359px){
  .grid-2{grid-template-columns:1fr}
  .metric-value{font-size:24px}
  .bmi-hero-number{font-size:40px}
  .bmi-hero-cat strong{font-size:15.5px}
}
@media (min-width:640px){
  .app-header{flex-direction:row;align-items:center;justify-content:space-between}
  .header-controls{width:auto}
  .lang-switch{flex:none}
  .lang-switch .seg-btn{padding:9px 20px}
  .brand h1{font-size:23px}
}
@media (min-width:900px){
  body{padding:36px 24px 64px}
  .app{max-width:960px}
  .layout{grid-template-columns:minmax(0,420px) minmax(0,1fr);
    gap:22px;align-items:start}
  .panel{padding:24px}
  .result-panel{position:sticky;top:36px}
  .empty-panel{padding:80px 24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </div>
      <div>
        <h1 data-i18n="title">智能健康分析助手</h1>
        <p data-i18n="subtitle">输入数据，精准评估你的健康指标</p>
      </div>
    </div>

    <div class="header-controls">
      <div class="segmented lang-switch" role="group" aria-label="Language">
        <button type="button" class="seg-btn is-active" data-lang="zh">华语</button>
        <button type="button" class="seg-btn" data-lang="en">English</button>
      </div>

      <button type="button" class="theme-toggle" id="themeToggle"
              aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="layout">

    <!-- ============ FORM ============ -->
    <section class="panel">
      <form class="form" id="form" novalidate>

        <div class="field">
          <span class="field-label" data-i18n="lbl_gender">性别</span>
          <div class="segmented" role="radiogroup" aria-label="Gender">
            <label class="seg-btn">
              <input type="radio" name="gender" value="female" checked>
              <span data-i18n="lbl_female">女性</span>
            </label>
            <label class="seg-btn">
              <input type="radio" name="gender" value="male">
              <span data-i18n="lbl_male">男性</span>
            </label>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="height">
              <span data-i18n="lbl_height">身高</span>
              <span class="hint">140–190</span>
            </label>
            <div class="input-wrap">
              <input id="height" type="number" inputmode="decimal" step="0.1"
                     min="140" max="190" data-i18n-ph="ph_height" placeholder="如 165">
              <span class="unit">cm</span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="weight">
              <span data-i18n="lbl_weight">当前体重</span>
            </label>
            <div class="input-wrap">
              <input id="weight" type="number" inputmode="decimal" step="0.1"
                     min="1" data-i18n-ph="ph_weight" placeholder="如 60.5">
              <span class="unit">kg</span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="bodyfat">
              <span data-i18n="lbl_bodyfat">体脂率</span>
            </label>
            <div class="input-wrap">
              <input id="bodyfat" type="number" inputmode="decimal" step="0.1"
                     min="1" max="75" data-i18n-ph="ph_bodyfat" placeholder="如 20.5">
              <span class="unit">%</span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="muscle">
              <span data-i18n="lbl_muscle">肌肉量</span>
            </label>
            <div class="input-wrap">
              <input id="muscle" type="number" inputmode="decimal" step="0.1"
                     min="0.1" data-i18n-ph="ph_muscle" placeholder="如 35.5">
              <span class="unit">kg</span>
            </div>
          </div>
        </div>

        <p class="form-error" id="formError" role="alert" hidden></p>

        <div class="actions">
          <button type="submit" class="btn btn-primary" data-i18n="btn_calc">开始分析</button>
          <button type="button" class="btn btn-ghost" id="btnClear" data-i18n="btn_clear">清除数据</button>
        </div>

      </form>
    </section>

    <!-- ============ RESULTS ============ -->
    <div>
      <section class="panel empty-panel" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 15l4-4.5 3 3L19 7"/>
        </svg>
        <p data-i18n="empty_text">填写资料后点击「开始分析」查看结果</p>
      </section>

      <section class="panel result-panel" id="resultPanel" hidden>

        <!-- BMI hero -->
        <div class="bmi-hero" id="bmiHero" data-cat="normal">
          <div class="bmi-hero-head">
            <div class="bmi-hero-value">
              <span class="bmi-hero-label" data-i18n="bmi_label">BMI</span>
              <span class="bmi-hero-number" id="bmiValue">0.0</span>
            </div>
            <div class="bmi-hero-cat">
              <strong id="bmiCategory">—</strong>
              <span id="bmiCategoryRange">—</span>
            </div>
          </div>

          <div class="bmi-scale">
            <div class="bmi-scale-track">
              <span class="bmi-seg bmi-seg--under"></span>
              <span class="bmi-seg bmi-seg--normal"></span>
              <span class="bmi-seg bmi-seg--over"></span>
              <span class="bmi-seg bmi-seg--obese"></span>
              <div class="bmi-scale-marker" id="bmiMarker"></div>
            </div>
            <div class="bmi-scale-labels" aria-hidden="true">
              <span data-i18n="bmi_short_under">偏瘦</span>
              <span data-i18n="bmi_short_normal">正常</span>
              <span data-i18n="bmi_short_over">偏重</span>
              <span data-i18n="bmi_short_obese">肥胖</span>
            </div>
          </div>
        </div>

        <!-- Status banner -->
        <div class="status" id="status" data-state="ok">
          <div class="status-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path class="ico-lose" d="M12 5v14M19 12l-7 7-7-7"/>
              <path class="ico-gain" d="M12 19V5M5 12l7-7 7 7"/>
              <path class="ico-ok"   d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <div class="status-text">
            <strong id="statusTitle">—</strong>
            <span id="statusSub">—</span>
          </div>
        </div>

        <!-- Weight range bar -->
        <div class="range">
          <div class="range-head">
            <span class="range-title" data-i18n="range_title">体重位置</span>
            <span class="range-current"><span id="currentWeight">0.0</span> kg</span>
          </div>
          <div class="range-track">
            <div class="range-band" id="rangeBand"></div>
            <div class="range-marker" id="rangeMarker"></div>
          </div>
          <div class="range-scale">
            <span id="scaleMin">—</span>
            <span id="scaleMax">—</span>
          </div>
        </div>

        <!-- Metric tiles -->
        <div class="metrics">
          <div class="metric metric--violet">
            <span class="metric-label" data-i18n="lbl_fat_label">体脂重量</span>
            <span class="metric-value"><span id="fatMass">0.0</span><span class="metric-unit">kg</span></span>
          </div>

          <div class="metric metric--cyan">
            <span class="metric-label" data-i18n="lbl_muscle_result">肌肉率</span>
            <span class="metric-value"><span id="muscleRatio">0.0</span><span class="metric-unit">%</span></span>
          </div>

          <div class="metric metric--amber metric--wide">
            <span class="metric-label" data-i18n="lbl_ideal_label">标准体重区间</span>
            <span class="metric-value"><span id="idealRange">0.0 – 0.0</span><span class="metric-unit">kg</span></span>
          </div>

          <div class="metric metric--wide" id="timeCard" data-state="ok">
            <span class="metric-label" data-i18n="month_label">达标所需时间</span>
            <span class="metric-value">
              <span id="timeValue">—</span><span class="metric-unit" id="timeUnit"></span>
            </span>
            <span class="metric-sub" id="timeSub"></span>
          </div>
        </div>

      </section>
    </div>

  </div>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   Configuration
   ========================================================= */
const CONFIG = {
  HEIGHT_MIN : 140,
  HEIGHT_MAX : 190,
  WEIGHT_MAX : 500,
  FAT_MIN    : 1,
  FAT_MAX    : 75,
  MONTHLY_RATE : 3,                    // kg per month (healthy pace)
  BMI_BANDS  : { female: [20, 21.5], male: [21.5, 23] },
  BMI_CDC    : { under: 18.5, over: 25, obese: 30 },
  BMI_SCALE  : [14, 40]
};

/* Ideal weight range derived from BMI band × height².
   This reproduces the previous 51-row lookup table exactly
   (female BMI 20–21.5, male BMI 21.5–23) with two lines of code. */
function idealWeights(heightCm, gender) {
  const m2 = (heightCm / 100) ** 2;
  const [lo, hi] = CONFIG.BMI_BANDS[gender];
  return [lo * m2, hi * m2];
}

function bmiCategory(bmi) {
  const c = CONFIG.BMI_CDC;
  if (bmi < c.under) return 'under';
  if (bmi < c.over)  return 'normal';
  if (bmi < c.obese) return 'over';
  return 'obese';
}

/* =========================================================
   Translations
   ========================================================= */
const I18N = {
  zh: {
    title: "智能健康分析助手",
    subtitle: "输入数据，精准评估你的健康指标",

    lbl_gender: "性别", lbl_female: "女性", lbl_male: "男性",
    lbl_height: "身高", lbl_weight: "当前体重",
    lbl_bodyfat: "体脂率", lbl_muscle: "肌肉量",

    ph_height: "如 165", ph_weight: "如 60.5",
    ph_bodyfat: "如 20.5", ph_muscle: "如 35.5",

    btn_calc: "开始分析", btn_clear: "清除数据",

    err_height: "请输入 140–190 之间的身高。",
    err_weight: "请输入有效的体重（大于 0）。",
    err_bodyfat: "请输入 1–75 之间的体脂率。",
    err_muscle: "请输入有效的肌肉量（大于 0）。",
    err_muscle_big: "肌肉量不能大于或等于总体重，请检查输入。",

    empty_text: "填写资料后点击「开始分析」查看结果",

    bmi_label: "BMI",
    bmi_under: "偏瘦", bmi_normal: "正常", bmi_over: "偏重", bmi_obese: "肥胖",
    bmi_short_under: "偏瘦", bmi_short_normal: "正常",
    bmi_short_over: "偏重", bmi_short_obese: "肥胖",
    bmi_range_under: "低于 18.5", bmi_range_normal: "18.5 – 25",
    bmi_range_over: "25 – 30",    bmi_range_obese: "高于 30",

    status_lose: "需要减重", status_gain: "需要增重", status_ok: "体重达标",
    status_lose_sub: "当前 {w} kg，超出标准上限 {d} kg",
    status_gain_sub: "当前 {w} kg，低于标准下限 {d} kg",
    status_ok_sub: "当前 {w} kg 处于标准范围内，继续保持",

    range_title: "体重位置",
    lbl_fat_label: "体脂重量",
    lbl_muscle_result: "肌肉率",
    lbl_ideal_label: "标准体重区间",
    month_label: "达标所需时间",
    time_unit_months: "个月",
    time_sub_weeks: "约 {weeks} 周",
    time_ok: "已达标，保持即可",

    theme_light: "切换到浅色模式",
    theme_dark:  "切换到深色模式"
  },
  en: {
    title: "Smart Health Analyzer",
    subtitle: "Enter your data for an accurate health assessment",

    lbl_gender: "Gender", lbl_female: "Female", lbl_male: "Male",
    lbl_height: "Height", lbl_weight: "Weight",
    lbl_bodyfat: "Body Fat", lbl_muscle: "Muscle",

    ph_height: "e.g. 165", ph_weight: "e.g. 60.5",
    ph_bodyfat: "e.g. 20.5", ph_muscle: "e.g. 35.5",

    btn_calc: "Analyze", btn_clear: "Clear All",

    err_height: "Please enter a height between 140 and 190 cm.",
    err_weight: "Please enter a valid weight (greater than 0).",
    err_bodyfat: "Please enter a body fat percentage between 1 and 75.",
    err_muscle: "Please enter a valid muscle mass (greater than 0).",
    err_muscle_big: "Muscle mass cannot be equal to or greater than total weight.",

    empty_text: "Fill in your details and tap “Analyze” to see results",

    bmi_label: "BMI",
    bmi_under: "Underweight", bmi_normal: "Normal",
    bmi_over: "Overweight",   bmi_obese: "Obese",
    bmi_short_under: "Under", bmi_short_normal: "Normal",
    bmi_short_over: "Over",   bmi_short_obese: "Obese",
    bmi_range_under: "Below 18.5", bmi_range_normal: "18.5 – 25",
    bmi_range_over: "25 – 30",     bmi_range_obese: "Above 30",

    status_lose: "Weight Loss Needed", status_gain: "Weight Gain Needed",
    status_ok: "Within Healthy Range",
    status_lose_sub: "Currently {w} kg — {d} kg above the upper limit",
    status_gain_sub: "Currently {w} kg — {d} kg below the lower limit",
    status_ok_sub: "Currently {w} kg — nicely within the healthy range",

    range_title: "Weight Position",
    lbl_fat_label: "Fat Mass",
    lbl_muscle_result: "Muscle Ratio",
    lbl_ideal_label: "Ideal Weight Range",
    month_label: "Time to Goal",
    time_unit_months: "months",
    time_sub_weeks: "≈ {weeks} weeks",
    time_ok: "On target — keep it up",

    theme_light: "Switch to light mode",
    theme_dark:  "Switch to dark mode"
  }
};

/* =========================================================
   DOM references & state
   ========================================================= */
const THEME_KEY = 'sha-theme';
const state = { lang: 'zh', theme: 'light' };
let lastResult = null;

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

const el = {
  form: $('form'), error: $('formError'),
  height: $('height'), weight: $('weight'),
  bodyfat: $('bodyfat'), muscle: $('muscle'),
  empty: $('emptyState'), panel: $('resultPanel'),

  bmiHero: $('bmiHero'), bmiValue: $('bmiValue'),
  bmiCategory: $('bmiCategory'), bmiCategoryRange: $('bmiCategoryRange'),
  bmiMarker: $('bmiMarker'),

  status: $('status'), statusTitle: $('statusTitle'), statusSub: $('statusSub'),
  currentWeight: $('currentWeight'),
  rangeBand: $('rangeBand'), rangeMarker: $('rangeMarker'),
  scaleMin: $('scaleMin'), scaleMax: $('scaleMax'),

  fatMass: $('fatMass'), muscleRatio: $('muscleRatio'),
  idealRange: $('idealRange'),
  timeCard: $('timeCard'), timeValue: $('timeValue'),
  timeUnit: $('timeUnit'), timeSub: $('timeSub'),

  themeToggle: $('themeToggle')
};

const FIELDS = [
  { input: el.height,  rule: n => n >= CONFIG.HEIGHT_MIN && n <= CONFIG.HEIGHT_MAX, msg: 'err_height'  },
  { input: el.weight,  rule: n => n > 0 && n <= CONFIG.WEIGHT_MAX,                  msg: 'err_weight'  },
  { input: el.bodyfat, rule: n => n >= CONFIG.FAT_MIN && n <= CONFIG.FAT_MAX,       msg: 'err_bodyfat' },
  { input: el.muscle,  rule: n => n > 0,                                            msg: 'err_muscle'  }
];

/* =========================================================
   Theme
   ========================================================= */
function syncThemeButton() {
  const label = I18N[state.lang][state.theme === 'dark' ? 'theme_light' : 'theme_dark'];
  el.themeToggle.setAttribute('aria-label', label);
  el.themeToggle.setAttribute('title', label);
  el.themeToggle.setAttribute('aria-pressed', String(state.theme === 'dark'));
}

function setTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
  syncThemeButton();
}

/* =========================================================
   i18n
   ========================================================= */
function applyI18n() {
  const t = I18N[state.lang];
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';

  $$('[data-i18n]').forEach(n => {
    const v = t[n.dataset.i18n];
    if (v != null) n.textContent = v;
  });
  $$('[data-i18n-ph]').forEach(n => {
    const v = t[n.dataset.i18nPh];
    if (v != null) n.placeholder = v;
  });
  $$('.lang-switch .seg-btn').forEach(btn =>
    btn.classList.toggle('is-active', btn.dataset.lang === state.lang)
  );

  syncThemeButton();
}

function setLang(lang) {
  if (lang === state.lang) return;
  state.lang = lang;
  applyI18n();
  if (lastResult) renderResult();
}

/* =========================================================
   Validation
   ========================================================= */
function showError(key) {
  el.error.textContent = I18N[state.lang][key] || key;
  el.error.hidden = false;
  el.error.classList.remove('shake');
  void el.error.offsetWidth;
  el.error.classList.add('shake');
}

const hideError = () => { el.error.hidden = true; el.error.classList.remove('shake'); };
const clearInvalid = () => FIELDS.forEach(f => f.input.classList.remove('is-invalid'));

function readAndValidate() {
  clearInvalid();
  hideError();

  const values = {
    gender : document.querySelector('input[name="gender"]:checked').value,
    height : parseFloat(el.height.value),
    weight : parseFloat(el.weight.value),
    bodyfat: parseFloat(el.bodyfat.value),
    muscle : parseFloat(el.muscle.value)
  };

  for (const f of FIELDS) {
    const v = values[f.input.id === 'bodyfat' ? 'bodyfat' : f.input.id];
    if (!Number.isFinite(v) || !f.rule(v)) {
      f.input.classList.add('is-invalid');
      showError(f.msg);
      f.input.focus({ preventScroll: false });
      return null;
    }
  }
  if (values.muscle >= values.weight) {
    el.muscle.classList.add('is-invalid');
    showError('err_muscle_big');
    el.muscle.focus();
    return null;
  }
  return values;
}

/* =========================================================
   Analysis
   ========================================================= */
function analyze(values) {
  const { gender, height, weight, bodyfat, muscle } = values;

  const [idealMin, idealMax] = idealWeights(height, gender);
  const bmi = weight / (height / 100) ** 2;

  const mode = weight < idealMin ? 'gain'
             : weight > idealMax ? 'lose'
             : 'ok';

  const diff = mode === 'gain' ? idealMin - weight
             : mode === 'lose' ? weight - idealMax
             : 0;

  const months = diff > 0 ? Math.ceil(diff / CONFIG.MONTHLY_RATE) : 0;
  const weeks  = months * 4;

  lastResult = {
    weight, mode, diff, months, weeks,
    idealMin, idealMax, bmi,
    bmiCat      : bmiCategory(bmi),
    fatMass     : weight * (bodyfat / 100),
    muscleRatio : (muscle / weight) * 100
  };

  renderResult();
  el.empty.hidden = true;
  el.panel.hidden = false;

  if (matchMedia('(max-width: 899px)').matches) {
    requestAnimationFrame(() =>
      el.panel.scrollIntoView({ behavior: 'smooth', block: 'start' })
    );
  }
}

/* =========================================================
   Render
   ========================================================= */
const fill = (str, vars) => str.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');

function renderResult() {
  if (!lastResult) return;
  const t = I18N[state.lang];
  const r = lastResult;
  const one = n => n.toFixed(1);

  /* --- BMI hero --- */
  el.bmiHero.dataset.cat = r.bmiCat;
  el.bmiValue.textContent = one(r.bmi);
  el.bmiCategory.textContent      = t['bmi_' + r.bmiCat];
  el.bmiCategoryRange.textContent = t['bmi_range_' + r.bmiCat];

  const [sMinB, sMaxB] = CONFIG.BMI_SCALE;
  const bmiPct = Math.min(97, Math.max(3,
    ((r.bmi - sMinB) / (sMaxB - sMinB)) * 100
  ));
  el.bmiMarker.style.left = bmiPct + '%';

  /* --- Status banner --- */
  el.status.dataset.state = r.mode;
  el.statusTitle.textContent = t[{
    lose: 'status_lose', gain: 'status_gain', ok: 'status_ok'
  }[r.mode]];
  el.statusSub.textContent = fill(t[{
    lose: 'status_lose_sub', gain: 'status_gain_sub', ok: 'status_ok_sub'
  }[r.mode]], { w: one(r.weight), d: one(r.diff) });

  /* --- Weight range bar --- */
  const span  = Math.max(r.idealMax - r.idealMin, 4);
  const pad   = span * 1.2;
  const sMin  = Math.max(0, r.idealMin - pad);
  const sMax  = r.idealMax + pad;
  const total = sMax - sMin;
  const pct   = v => ((v - sMin) / total) * 100;

  el.rangeBand.style.left  = pct(r.idealMin) + '%';
  el.rangeBand.style.width = (pct(r.idealMax) - pct(r.idealMin)) + '%';
  el.rangeMarker.style.left = Math.min(97, Math.max(3, pct(r.weight))) + '%';

  el.currentWeight.textContent = one(r.weight);
  el.scaleMin.textContent = Math.round(sMin) + ' kg';
  el.scaleMax.textContent = Math.round(sMax) + ' kg';

  /* --- Metric tiles --- */
  el.fatMass.textContent     = one(r.fatMass);
  el.muscleRatio.textContent = one(r.muscleRatio);
  el.idealRange.textContent  = one(r.idealMin) + ' – ' + one(r.idealMax);

  el.timeCard.dataset.state = r.mode;
  if (r.mode === 'ok') {
    el.timeValue.textContent = '—';
    el.timeUnit.textContent  = '';
    el.timeSub.textContent   = t.time_ok;
  } else {
    el.timeValue.textContent = r.months;
    el.timeUnit.textContent  = t.time_unit_months;
    el.timeSub.textContent   = fill(t.time_sub_weeks, { weeks: r.weeks });
  }
}

/* =========================================================
   Clear
   ========================================================= */
function clearAll() {
  if (document.activeElement?.blur) document.activeElement.blur();

  FIELDS.forEach(f => {
    f.input.value = '';
    f.input.classList.remove('is-invalid');
  });
  document.querySelector('input[name="gender"][value="female"]').checked = true;

  hideError();
  lastResult = null;
  el.panel.hidden = true;
  el.empty.hidden = false;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   Events
   ========================================================= */
el.form.addEventListener('submit', e => {
  e.preventDefault();
  const v = readAndValidate();
  if (v) analyze(v);
});

$('btnClear').addEventListener('click', clearAll);

$$('.lang-switch .seg-btn').forEach(btn =>
  btn.addEventListener('click', () => setLang(btn.dataset.lang))
);

el.themeToggle.addEventListener('click', () =>
  setTheme(state.theme === 'dark' ? 'light' : 'dark')
);

FIELDS.forEach(f =>
  f.input.addEventListener('input', () => {
    f.input.classList.remove('is-invalid');
    hideError();
  })
);

/* =========================================================
   Boot
   ========================================================= */
state.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
syncThemeButton();
applyI18n();

})();
</script>
</body>
</html>
