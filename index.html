<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<title>智能健康分析助手 · Smart Health Analyzer</title>

<!-- ═══════════════════════════════════════════════════════════
     HEAD · 首屏主题预设（避免深色模式闪白）
     ═══════════════════════════════════════════════════════════ -->
<script>
(() => {
  let theme = 'light';
  try {
    const saved = localStorage.getItem('sha-theme');
    theme = (saved === 'light' || saved === 'dark')
      ? saved
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch {}
  document.documentElement.dataset.theme = theme;
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     STYLE
     ───────────────────────────────────────────────────────────
     分层结构：
       @layer base  ——  设计变量 & 全局重置
       @layer ui    ——  组件样式
       @layer resp  ——  响应式适配
     ═══════════════════════════════════════════════════════════ -->
<style>
@layer base, ui, resp;


/* ============================================================
 * @layer base · 设计变量与全局重置
 * ============================================================ */
@layer base {

  /* ----------------------------------------------------------
   * B-1  设计令牌（Design Tokens）
   * -------------------------------------------------------- */
  :root {
    color-scheme: light dark;

    /* —— 背景 / 卡片 / 文字 —— */
    --bg:    light-dark(#eef1f6, #0b1220);
    --card:  light-dark(#ffffff, #131c2b);
    --card2: light-dark(#f6f8fb, #1a2434);
    --line:  light-dark(#e4e9f0, #26324a);
    --tx:    light-dark(#0f172a, #e9eef7);
    --mut:   light-dark(#64748b, #93a3b8);
    --nav:   light-dark(rgba(255, 255, 255, .88), rgba(19, 28, 43, .92));

    /* —— 主题色（绿） —— */
    --br:   light-dark(#10b981, #34d399);   /* 主色 */
    --brS:  light-dark(#10b981, #059669);   /* 实心按钮底色 */
    --brI:  light-dark(#047857, #6ee7b7);   /* 文字 / 图标色 */
    --brSf: light-dark(#e8f8f1, #0c2b22);   /* 浅色填充 */
    --brR:  light-dark(rgba(16, 185, 129, .18), rgba(52, 211, 153, .2));  /* 光环 */
    --brG:  light-dark(rgba(16, 185, 129, .35), rgba(5, 150, 105, .45));  /* 投影 */

    /* —— 危险色（红） —— */
    --dg:   light-dark(#ef4444, #f87171);
    --dgI:  light-dark(#b91c1c, #fca5a5);
    --dgSf: light-dark(#fee2e2, #3a1416);
    --dgR:  light-dark(rgba(239, 68, 68, .15), rgba(248, 113, 113, .2));

    /* —— 辅助色：蓝 / 紫 / 琥珀 / 青 —— */
    --inI:  light-dark(#1d4ed8, #93c5fd);
    --inSf: light-dark(#dbeafe, #13233d);
    --viI:  light-dark(#6d28d9, #c4b5fd);
    --viSf: light-dark(#ede9fe, #241a3d);
    --amI:  light-dark(#b45309, #fcd34d);
    --amSf: light-dark(#fef3c7, #3a2a0a);
    --cyI:  light-dark(#0e7490, #67e8f9);
    --cySf: light-dark(#cffafe, #0a2b33);

    /* —— 阴影 —— */
    --sh: 0 1px 2px light-dark(rgba(15, 23, 42, .04), rgba(0, 0, 0, .4)),
          0 10px 30px -14px light-dark(rgba(15, 23, 42, .22), rgba(0, 0, 0, .7));

    /* —— 安全区 —— */
    --st: env(safe-area-inset-top, 0);
    --sb: env(safe-area-inset-bottom, 0);
    --sl: env(safe-area-inset-left, 0);
    --sr: env(safe-area-inset-right, 0);

    /* —— 尺寸 / 圆角 / 动画 —— */
    --ab: 56px;   /* 顶栏高度 */
    --tb: 60px;   /* 底部标签栏高度 */
    --rL: 20px;
    --rM: 14px;
    --rS: 11px;
    --ez: cubic-bezier(.22, 1, .36, 1);
    --tr: background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  }

  :root[data-theme=light] { color-scheme: light; }
  :root[data-theme=dark]  { color-scheme: dark;  }

  /* ----------------------------------------------------------
   * B-2  全局重置
   * -------------------------------------------------------- */
  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body, h1, p { margin: 0; }

  button, input { font: inherit; color: inherit; }

  button {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  input { border: 0; background: none; }

  /* 去掉数字输入框的上下箭头 */
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  svg { display: block; }

  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    background: var(--bg);
    color: var(--tx);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    transition: var(--tr);
    overflow: hidden;
  }

  :focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--brR);
    border-radius: var(--rS);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
}


/* ============================================================
 * @layer ui · 组件样式
 * ============================================================ */
@layer ui {

  /* ==========================================================
   * U-01  应用骨架
   * ======================================================== */
  .app {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg);
  }

  /* ==========================================================
   * U-02  顶栏
   * ======================================================== */
  .bar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    height: calc(var(--ab) + var(--st));
    padding: var(--st) calc(16px + var(--sr)) 0 calc(16px + var(--sl));
    background: var(--nav);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    transition: border-color .25s, box-shadow .25s;
  }

  .bar.sc { box-shadow: 0 4px 16px -12px rgba(0, 0, 0, .5); }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }

  .bmark {
    flex: none;
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    color: #fff;
    background: linear-gradient(140deg, #34d399, #059669);
    box-shadow: 0 4px 10px -4px var(--brG);
  }
  .bmark svg { width: 17px; height: 17px; }

  .btitle {
    display: flex;
    flex-direction: column;
    min-width: 0;
    line-height: 1.2;
  }
  .btitle strong {
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btitle small {
    font-size: 11px;
    font-weight: 600;
    color: var(--mut);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bacts { display: flex; gap: 6px; align-items: center; }

  .ibtn {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    color: var(--mut);
    transition: background .18s, color .18s, transform .12s;
  }
  .ibtn:hover { color: var(--brI); background: var(--brSf); }
  .ibtn:active { transform: scale(.92); }
  .ibtn svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 主题按钮：深色显示太阳，浅色显示月亮 */
  .isun { display: none; }
  :root[data-theme=dark] .isun  { display: block; }
  :root[data-theme=dark] .imoon { display: none; }

  /* ==========================================================
   * U-03  滚动区与视图
   * ======================================================== */
  .body {
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .body::-webkit-scrollbar { display: none; }

  .view {
    padding: 16px calc(16px + var(--sr)) 24px calc(16px + var(--sl));
    animation: viewIn .28s var(--ez);
  }

  @keyframes viewIn {
    from { opacity: 0; translate: 0 6px; }
    to   { opacity: 1; translate: 0 0;   }
  }

  /* ==========================================================
   * U-04  底部标签栏
   * ======================================================== */
  .tabs {
    position: sticky;
    bottom: 0;
    z-index: 30;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    height: calc(var(--tb) + var(--sb));
    padding: 0 calc(8px + var(--sr)) var(--sb) calc(8px + var(--sl));
    background: var(--nav);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--line);
  }

  .tab {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--mut);
    font-size: 10.5px;
    font-weight: 700;
    transition: color .18s;
  }
  .tab svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform .18s var(--ez);
  }
  .tab:active svg { transform: scale(.88); }
  .tab.on { color: var(--brI); }
  .tab.on svg { stroke-width: 2.3; }

  .bdg {
    position: absolute;
    top: 8px;
    left: 50%;
    translate: 10px 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--br);
    box-shadow: 0 0 0 2px var(--nav);
  }

  /* ==========================================================
   * U-05  卡片与表单
   * ======================================================== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--rL);
    box-shadow: var(--sh);
    padding: 18px;
    transition: var(--tr);
  }

  .form { display: flex; flex-direction: column; gap: 16px; }

  .fh {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 2px;
  }
  .fh h2 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .fh span { font-size: 11.5px; font-weight: 600; color: var(--mut); }

  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .fld {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
  }

  .flbl {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--tx);
  }
  .hint { font-size: 11px; font-weight: 600; color: var(--mut); opacity: .85; }

  /* 输入框 + 单位 */
  .iw { position: relative; display: flex; align-items: center; }

  .iw input {
    width: 100%;
    min-width: 0;
    padding: 13px 44px 13px 14px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--tx);
    background: var(--card2);
    border: 1.5px solid var(--line);
    border-radius: var(--rS);
    transition: var(--tr);
  }
  .iw input::placeholder { font-weight: 500; color: var(--mut); opacity: .7; }
  .iw input:focus {
    outline: none;
    background: var(--card);
    border-color: var(--br);
    box-shadow: 0 0 0 4px var(--brR);
  }
  .iw input.bad {
    border-color: var(--dg);
    box-shadow: 0 0 0 4px var(--dgR);
  }

  .un {
    position: absolute;
    right: 14px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--mut);
    pointer-events: none;
  }

  .err {
    margin: 0;
    padding: 11px 13px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--dgI);
    background: var(--dgSf);
    border-radius: var(--rS);
  }

  /* 性别分段控件 */
  .seg {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: var(--rM);
    transition: var(--tr);
  }

  .segb {
    position: relative;
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--mut);
    font-size: 14px;
    font-weight: 700;
    transition: background .18s, color .18s, box-shadow .18s;
  }
  .segb input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .segb:hover { color: var(--tx); }
  .segb.on,
  .segb:has(input:checked) {
    background: var(--brSf);
    color: var(--brI);
    box-shadow: inset 0 0 0 1.5px var(--br);
  }

  /* ==========================================================
   * U-06  按钮
   * ======================================================== */
  .acts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 2px;
  }

  .btn {
    width: 100%;
    padding: 15px 18px;
    border: 1.5px solid transparent;
    border-radius: var(--rS);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .01em;
    transition: transform .16s, background .18s, box-shadow .18s,
                color .18s, border-color .18s, filter .18s;
  }
  .btn:active { transform: translateY(1px) scale(.995); }

  .bp {
    background: var(--brS);
    color: #fff;
    box-shadow: 0 8px 20px -10px var(--brG);
  }
  .bp:hover  { filter: brightness(1.07); box-shadow: 0 12px 24px -10px var(--brG); }
  .bp:active { filter: brightness(.95); }

  .bg {
    background: transparent;
    color: var(--mut);
    border-color: var(--line);
  }
  .bg:hover {
    color: var(--dgI);
    border-color: var(--dg);
    background: var(--dgSf);
  }

  /* ==========================================================
   * U-07  空状态
   * ======================================================== */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 56px 24px;
    color: var(--mut);
  }
  .empty svg { width: 38px; height: 38px; opacity: .45; }
  .empty p {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.55;
    max-width: 240px;
    text-wrap: pretty;
  }

  /* ==========================================================
   * U-08  结果区容器
   * ======================================================== */
  .rstk { display: flex; flex-direction: column; gap: 12px; }

  /* ----------------------------------------------------------
   * U-09  数值胶囊条（可点击内联编辑）
   * -------------------------------------------------------- */
  .sbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .shint {
    flex-basis: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--mut);
  }
  .shint svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .8;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 38px;
    padding: 8px 12px;
    border-radius: 999px;
    background: var(--card);
    border: 1.5px solid var(--line);
    font-size: 13px;
    font-weight: 700;
    color: var(--tx);
    cursor: pointer;
    user-select: none;
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, border-color .15s, color .15s,
                transform .12s, box-shadow .15s;
  }
  .chip:hover,
  .chip:focus-visible {
    border-color: var(--br);
    background: var(--brSf);
  }
  .chip:active { transform: scale(.97); }

  /* 右侧小圆点：提示可点击 */
  .chip::after {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--br);
    opacity: .55;
    margin-left: 2px;
    transition: opacity .15s;
  }
  .chip:hover::after,
  .chip:focus-visible::after { opacity: 1; }

  /* 展开编辑态 */
  .chip.edit {
    flex-basis: 100%;
    display: block;
    padding: 0;
    border-radius: var(--rM);
    cursor: default;
    background: var(--card);
    border: 1.5px solid var(--br);
    box-shadow: 0 0 0 4px var(--brR);
    animation: chipOpen .22s var(--ez);
  }
  .chip.edit:hover  { background: var(--card); }
  .chip.edit:active { transform: none; }
  .chip.edit::after { display: none; }

  @keyframes chipOpen {
    from { opacity: .4; transform: scale(.98); }
    to   { opacity: 1;  transform: scale(1);   }
  }

  .ci { font-size: 14px; line-height: 1; color: var(--brI); }
  .cl { font-size: 11px; font-weight: 800; letter-spacing: .02em; color: var(--mut); text-transform: uppercase; }
  .cv { font-size: 13.5px; font-weight: 800; color: var(--tx); }
  .cu { font-size: 11px; font-weight: 700; color: var(--mut); margin-left: -1px; }

  /* 「完整编辑」按钮 */
  .chip.act {
    background: transparent;
    border-style: dashed;
    color: var(--mut);
    padding-inline: 11px;
  }
  .chip.act svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .chip.act::after { display: none; }

  /* ----------------------------------------------------------
   * U-10  内联编辑器
   * -------------------------------------------------------- */
  .ed {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px;
  }

  .edh {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .edl { font-size: 14px; font-weight: 800; color: var(--tx); letter-spacing: -.01em; }
  .edr { font-size: 11.5px; font-weight: 700; color: var(--mut); font-variant-numeric: tabular-nums; }

  .edf {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: stretch;
    gap: 6px;
    background: var(--card2);
    border: 1.5px solid var(--line);
    border-radius: var(--rS);
    padding: 4px;
    transition: var(--tr);
  }
  .edf:focus-within {
    border-color: var(--br);
    background: var(--card);
    box-shadow: 0 0 0 3px var(--brR);
  }

  .eds {
    display: grid;
    place-items: center;
    width: 42px;
    border-radius: 9px;
    color: var(--mut);
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    user-select: none;
    transition: background .15s, color .15s, transform .12s;
  }
  .eds:hover  { background: var(--card); color: var(--brI); }
  .eds:active { transform: scale(.92); }

  .edi {
    width: 100%;
    min-width: 0;
    padding: 10px 8px;
    background: transparent;
    border: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.02em;
    text-align: center;
    color: var(--tx);
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .edi:focus { outline: none; }
  .edi.bad { color: var(--dgI); }

  .edu {
    display: grid;
    place-items: center;
    padding-inline: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--mut);
    user-select: none;
  }

  .ede {
    margin: 0;
    padding: 8px 11px;
    border-radius: 9px;
    background: var(--dgSf);
    color: var(--dgI);
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.4;
  }

  .eda { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .edb {
    padding: 12px 14px;
    border-radius: var(--rS);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .01em;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, color .15s, transform .12s, filter .15s;
  }
  .edb:active { transform: scale(.97); }

  .edb.g {
    background: transparent;
    color: var(--mut);
    border: 1.5px solid var(--line);
  }
  .edb.g:hover { color: var(--tx); border-color: var(--tx); }

  .edb.p {
    background: var(--brS);
    color: #fff;
    box-shadow: 0 6px 14px -8px var(--brG);
  }
  .edb.p:hover  { filter: brightness(1.07); }
  .edb.p:active { filter: brightness(.95); }

  /* ----------------------------------------------------------
   * U-11  BMI 卡片（紧凑版：只求「一眼看清」）
   * -------------------------------------------------------- */
  .bh {
    padding: 14px 16px;
    border-radius: var(--rM);
    border: 1px solid transparent;
    transition: background .3s, color .3s;
  }
  .bh[data-cat=under]  { background: var(--cySf); color: var(--cyI); }
  .bh[data-cat=normal] { background: var(--brSf); color: var(--brI); }
  .bh[data-cat=over]   { background: var(--amSf); color: var(--amI); }
  .bh[data-cat=obese]  { background: var(--dgSf); color: var(--dgI); }

  .bhh {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .bhl {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .09em;
    text-transform: uppercase;
    opacity: .85;
  }
  .bhn {
    font-size: 34px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
  }
  .bhc {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1px;
    text-align: right;
  }
  .bhc strong { font-size: 14.5px; font-weight: 800; letter-spacing: -.015em; }
  .bhc span   { font-size: 11px; font-weight: 700; opacity: .8; font-variant-numeric: tabular-nums; }

  /* BMI 刻度条 */
  .bst { position: relative; display: flex; height: 8px; border-radius: 999px; }

  .bss { height: 100%; }
  .bss:first-child { border-radius: 999px 0 0 999px; }
  .bss:last-child  { border-radius: 0 999px 999px 0; }

  .bss.u { flex: 4.5; background: var(--cyI); opacity: .38; }
  .bss.n { flex: 6.5; background: var(--brI); opacity: .55; }
  .bss.o { flex: 5;   background: var(--amI); opacity: .50; }
  .bss.b { flex: 10;  background: var(--dgI); opacity: .48; }

  .bsm {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: currentColor;
    border: 2.5px solid var(--card);
    translate: -50% -50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
    z-index: 2;
    transition: left .6s var(--ez);
  }

  .bsl {
    display: flex;
    margin-top: 7px;
    font-size: 10px;
    font-weight: 800;
    opacity: .82;
  }
  .bsl span {
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
  }
  .bsl span:nth-child(1) { flex: 4.5; }
  .bsl span:nth-child(2) { flex: 6.5; }
  .bsl span:nth-child(3) { flex: 5; }
  .bsl span:nth-child(4) { flex: 10; }

  /* ----------------------------------------------------------
   * U-12  状态条（放大版：突出「要增减多少公斤」）
   * -------------------------------------------------------- */
  .sts {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 17px 18px;
    border-radius: var(--rL);
    border: 1.5px solid transparent;
    transition: var(--tr);
  }
  .sts[data-s=lose] { background: var(--dgSf); color: var(--dgI); border-color: var(--dgR); }
  .sts[data-s=gain] { background: var(--inSf); color: var(--inI); }
  .sts[data-s=ok]   { background: var(--brSf); color: var(--brI); border-color: var(--brR); }

  .sti {
    flex: none;
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: currentColor;
  }
  .sti svg {
    width: 23px;
    height: 23px;
    stroke: var(--card);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  /* 只显示当前状态对应的那一个图标 */
  .sti path { display: none; }
  .sts[data-s=lose] .il,
  .sts[data-s=gain] .ig,
  .sts[data-s=ok]   .io { display: block; }

  .stt {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    flex: 1 1 auto;
  }
  .stt strong {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .stt span {
    font-size: 12px;
    font-weight: 600;
    opacity: .88;
    line-height: 1.4;
  }

  /* 大号数值：需要增 / 减的公斤数 */
  .std {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    margin-left: auto;
    padding-left: 8px;
    text-align: right;
  }
  .stdn {
    font-size: 34px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
  }
  .stdu {
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .07em;
    text-transform: uppercase;
    opacity: .68;
  }

  /* ----------------------------------------------------------
   * U-13  体重位置滑轨
   * -------------------------------------------------------- */
  .rh {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .rt { font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--mut); }
  .rc { font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .rtk {
    position: relative;
    height: 10px;
    border-radius: 999px;
    background: var(--card2);
    border: 1px solid var(--line);
    transition: var(--tr);
  }
  .rb {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 999px;
    background: var(--br);
    opacity: .32;
  }
  .rm {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--card);
    border: 3.5px solid var(--br);
    translate: -50% -50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
    transition: left .55s var(--ez);
  }
  .rs {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--mut);
    font-variant-numeric: tabular-nums;
  }

  /* ----------------------------------------------------------
   * U-14  指标网格
   * -------------------------------------------------------- */
  .mt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .m {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 14px;
    border-radius: var(--rM);
    background: var(--card2);
    border: 1.5px solid var(--line);
    min-width: 0;
    transition: var(--tr);
  }
  .m.w { grid-column: span 2; }

  /* 配色变体 */
  .m.v { background: var(--viSf); border-color: transparent; }
  .m.v .ml, .m.v .mv { color: var(--viI); }

  .m.c { background: var(--cySf); border-color: transparent; }
  .m.c .ml, .m.c .mv { color: var(--cyI); }

  .m.a { background: var(--amSf); border-color: transparent; }
  .m.a .ml, .m.a .mv { color: var(--amI); }

  #tc[data-s=lose] { background: var(--dgSf); border-color: transparent; }
  #tc[data-s=lose] .ml, #tc[data-s=lose] .mv { color: var(--dgI); }

  #tc[data-s=gain] { background: var(--inSf); border-color: transparent; }
  #tc[data-s=gain] .ml, #tc[data-s=gain] .mv { color: var(--inI); }

  #tc[data-s=ok] { background: var(--brSf); border-color: transparent; }
  #tc[data-s=ok] .ml, #tc[data-s=ok] .mv { color: var(--brI); }

  .ml {
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--mut);
  }
  .mv {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 3px;
    font-size: 26px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
  }
  .mu { font-size: 13px; font-weight: 700; opacity: .6; }
  .ms { margin-top: 1px; font-size: 11.5px; font-weight: 700; opacity: .72; }

  /* 数值更新时的脉冲动画 */
  .m.pulse { animation: pulse .6s var(--ez); }
  @keyframes pulse {
    0%   { transform: scale(1);    }
    40%  { transform: scale(1.02); }
    100% { transform: scale(1);    }
  }
}


/* ============================================================
 * @layer resp · 响应式适配
 * ============================================================ */
@layer resp {

  /* 超窄屏：单列布局 + 进一步压缩 */
  @media (max-width: 359px) {
    .g2 { grid-template-columns: 1fr; }
    .mv { font-size: 23px; }

    .bhn { font-size: 30px; }
    .bhc strong { font-size: 13.5px; }

    .sts { padding: 14px; gap: 11px; }
    .sti { width: 40px; height: 40px; }
    .sti svg { width: 20px; height: 20px; }
    .stt strong { font-size: 14px; }
    .stdn { font-size: 27px; }

    .edi { font-size: 20px; }
    .eds { width: 38px; }
  }

  /* 大屏：居中卡片式布局 */
  @media (min-width: 520px) {
    .app {
      height: min(100dvh, 900px);
      margin-block: max(0px, calc((100dvh - 900px) / 2));
      border-inline: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px -30px rgba(0, 0, 0, .35);
    }
  }
}
</style>
</head>


<body>
<div class="app">

  <!-- ═════════════════════════════════════════════════════════
       VIEW · 顶栏
       ═════════════════════════════════════════════════════════ -->
  <header class="bar" id="bar">
    <div class="brand">
      <div class="bmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </div>
      <div class="btitle">
        <strong data-i="title">智能健康分析助手</strong>
        <small data-i="subtitle">输入数据，精准评估</small>
      </div>
    </div>

    <div class="bacts">
      <!-- 语言切换 -->
      <button type="button" class="ibtn" id="lang" aria-label="Switch language">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
        </svg>
      </button>

      <!-- 主题切换 -->
      <button type="button" class="ibtn" id="theme" aria-label="Toggle theme" aria-pressed="false">
        <svg class="imoon" viewBox="0 0 24 24">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="isun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═════════════════════════════════════════════════════════
       VIEW · 主体滚动区
       ═════════════════════════════════════════════════════════ -->
  <main class="body" id="body">

    <!-- ------------------------------------------------------
         V-1  输入视图
         ------------------------------------------------------ -->
    <section class="view" data-v="input">
      <div class="card">
        <form class="form" id="form" novalidate>

          <div class="fh">
            <h2 data-i="form_title">你的身体数据</h2>
            <span data-i="form_hint">全部为必填</span>
          </div>

          <!-- 性别 -->
          <div class="fld">
            <span class="flbl" id="glabel" data-i="lbl_gender">性别</span>
            <div class="seg" role="radiogroup" aria-labelledby="glabel">
              <label class="segb">
                <input type="radio" name="gender" value="female" checked>
                <span data-i="lbl_female">女性</span>
              </label>
              <label class="segb">
                <input type="radio" name="gender" value="male">
                <span data-i="lbl_male">男性</span>
              </label>
            </div>
          </div>

          <!-- 四项身体数据 -->
          <div class="g2">
            <div class="fld">
              <label class="flbl" for="height">
                <span data-i="lbl_height">身高</span>
                <span class="hint">140–190</span>
              </label>
              <div class="iw">
                <input id="height" type="number" inputmode="decimal" step="0.1"
                       min="140" max="190" data-ph="ph_height" placeholder="165">
                <span class="un">cm</span>
              </div>
            </div>

            <div class="fld">
              <label class="flbl" for="weight">
                <span data-i="lbl_weight">当前体重</span>
              </label>
              <div class="iw">
                <input id="weight" type="number" inputmode="decimal" step="0.1"
                       min="1" data-ph="ph_weight" placeholder="60.5">
                <span class="un">kg</span>
              </div>
            </div>

            <div class="fld">
              <label class="flbl" for="bodyfat">
                <span data-i="lbl_bodyfat">体脂率</span>
              </label>
              <div class="iw">
                <input id="bodyfat" type="number" inputmode="decimal" step="0.1"
                       min="1" max="75" data-ph="ph_bodyfat" placeholder="20.5">
                <span class="un">%</span>
              </div>
            </div>

            <div class="fld">
              <label class="flbl" for="muscle">
                <span data-i="lbl_muscle">肌肉量</span>
              </label>
              <div class="iw">
                <input id="muscle" type="number" inputmode="decimal" step="0.1"
                       min="0.1" data-ph="ph_muscle" placeholder="35.5">
                <span class="un">kg</span>
              </div>
            </div>
          </div>

          <p class="err" id="err" role="alert" hidden></p>

          <div class="acts">
            <button type="submit" class="btn bp" data-i="btn_calc">开始分析</button>
            <button type="button" class="btn bg" id="clear" data-i="btn_clear">清除数据</button>
          </div>

        </form>
      </div>
    </section>

    <!-- ------------------------------------------------------
         V-2  分析结果视图
         ------------------------------------------------------ -->
    <section class="view" data-v="results" hidden aria-live="polite">

      <!-- 数据胶囊条（可点击内联编辑） -->
      <div class="sbar" id="sbar" hidden></div>

      <!-- 空状态 -->
      <div class="empty" id="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/>
          <path d="M7 15l4-4.5 3 3L19 7"/>
        </svg>
        <p data-i="empty_text">还没有数据，先去「输入」页填写吧</p>
      </div>

      <!-- 结果堆栈 -->
      <div class="rstk" id="rstk" hidden>

        <!-- R-1  BMI 大卡片（紧凑） -->
        <div class="bh" id="bh" data-cat="normal">
          <div class="bhh">
            <div>
              <div class="bhl" data-i="bmi_label">BMI</div>
              <div class="bhn" id="bhn">0.0</div>
            </div>
            <div class="bhc">
              <strong id="bhc">—</strong>
              <span id="bhr">—</span>
            </div>
          </div>

          <div class="bst">
            <span class="bss u"></span>
            <span class="bss n"></span>
            <span class="bss o"></span>
            <span class="bss b"></span>
            <div class="bsm" id="bsm"></div>
          </div>

          <div class="bsl" aria-hidden="true">
            <span data-i="bmi_short_under">偏瘦</span>
            <span data-i="bmi_short_normal">正常</span>
            <span data-i="bmi_short_over">偏重</span>
            <span data-i="bmi_short_obese">肥胖</span>
          </div>
        </div>

        <!-- R-2  状态条（突出增减公斤数） -->
        <div class="sts" id="sts" data-s="ok">
          <div class="sti">
            <svg viewBox="0 0 24 24">
              <path class="il" d="M12 5v14M19 12l-7 7-7-7"/>
              <path class="ig" d="M12 19V5M5 12l7-7 7 7"/>
              <path class="io" d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <div class="stt">
            <strong id="stt">—</strong>
            <span id="stsub">—</span>
          </div>
          <div class="std" id="std" hidden>
            <span class="stdn" id="stdn">0.0</span>
            <span class="stdu" id="stdu">kg</span>
          </div>
        </div>

        <!-- R-3  体重位置滑轨 -->
        <div class="card">
          <div class="rh">
            <span class="rt" data-i="range_title">体重位置</span>
            <span class="rc"><span id="cw">0.0</span> kg</span>
          </div>
          <div class="rtk">
            <div class="rb" id="rb"></div>
            <div class="rm" id="rm"></div>
          </div>
          <div class="rs">
            <span id="smin">—</span>
            <span id="smax">—</span>
          </div>
        </div>

        <!-- R-4  指标网格 -->
        <div class="mt">
          <div class="m v" id="cf">
            <span class="ml" data-i="lbl_fat_label">体脂重量</span>
            <span class="mv"><span id="fm">0.0</span><span class="mu">kg</span></span>
          </div>

          <div class="m c" id="cm">
            <span class="ml" data-i="lbl_muscle_result">肌肉率</span>
            <span class="mv"><span id="mr">0.0</span><span class="mu">%</span></span>
          </div>

          <div class="m a w" id="ci">
            <span class="ml" data-i="lbl_ideal_label">标准体重区间</span>
            <span class="mv"><span id="ir">0.0 – 0.0</span><span class="mu">kg</span></span>
          </div>

          <div class="m w" id="tc" data-s="ok">
            <span class="ml" data-i="month_label">达标所需时间</span>
            <span class="mv"><span id="tv">—</span><span class="mu" id="tu"></span></span>
            <span class="ms" id="ts"></span>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- ═════════════════════════════════════════════════════════
       VIEW · 底部标签栏
       ═════════════════════════════════════════════════════════ -->
  <nav class="tabs" role="tablist">
    <button class="tab on" data-t="input" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
      <span data-i="tab_input">输入</span>
    </button>

    <button class="tab" data-t="results" role="tab" aria-selected="false" id="tabr">
      <svg viewBox="0 0 24 24">
        <path d="M3 3v18h18"/>
        <path d="M7 15l4-4.5 3 3L19 7"/>
      </svg>
      <span data-i="tab_results">分析</span>
      <span class="bdg" id="bdg" hidden></span>
    </button>
  </nav>

</div>


<!-- ═══════════════════════════════════════════════════════════
     SCRIPT
     ───────────────────────────────────────────────────────────
     §1  配置常量          §7   表单校验
     §2  文案（i18n）       §8   结果渲染
     §3  DOM 引用          §9   胶囊条 & 内联编辑
     §4  应用状态          §10  视图 / 主题 / 语言
     §5  工具函数          §11  事件绑定
     §6  业务计算          §12  初始化
     ═══════════════════════════════════════════════════════════ -->
<script type="module">

/* ============================================================
 * § 1  配置常量
 * ============================================================ */

/** 全局业务参数：改这里就能调整判定标准 */
const CONFIG = {
  /** 各字段的合法范围 */
  limits: {
    height:  { min: 140, max: 190 },
    weight:  { min: 0.1, max: 500 },
    bodyfat: { min: 1,   max: 75  },
  },

  /** 每月可减 / 增的体重（kg） */
  ratePerMonth: 3,

  /**

/* ============================================================
 * § 5  工具函数
 * ============================================================ */

/** 保留一位小数 */
const fmt1 = n => n.toFixed(1);

/** 格式化数值区间，整数不补小数点 */
const fmtRange = (a, b) =>
  `${Number.isInteger(a) ? a : fmt1(a)} – ${Number.isInteger(b) ? b : fmt1(b)}`;

/** 模板替换：{key} → vars[key] */
const fill = (tpl, vars) =>
  tpl.replace(/\{(\w+)\}/g, (_, key) => vars[key] ?? '');

/** 触感反馈（不支持的设备静默失败） */
const haptic = (pattern = 8) => {
  try { navigator.vibrate?.(pattern); } catch {}
};

/** 左右抖动，用于错误提示 */
const shake = el => el.animate(
  [{ translate: '0' }, { translate: '-4px' }, { translate: '4px' }, { translate: '0' }],
  { duration: 280, easing: 'ease-in-out' }
);


/* ============================================================
 * § 6  业务计算
 * ============================================================ */

/**
 * 根据身高和性别计算标准体重区间（kg）
 * @returns {[number, number]} [下限, 上限]
 */
function idealWeightRange(heightCm, gender) {
  const m2 = (heightCm / 100) ** 2;
  const [lo, hi] = CONFIG.idealBmiBands[gender];
  return [lo * m2, hi * m2];
}

/** BMI 分级：under | normal | over | obese */
function bmiCategory(bmi) {
  if (bmi < CONFIG.cdc.under) return 'under';
  if (bmi < CONFIG.cdc.over)  return 'normal';
  if (bmi < CONFIG.cdc.obese) return 'over';
  return 'obese';
}

/**
 * 核心分析
 * @param {{gender:string,height:number,weight:number,bodyfat:number,muscle:number}} data
 */
function analyze({ gender, height, weight, bodyfat, muscle }) {
  const [idealMin, idealMax] = idealWeightRange(height, gender);

  const bmi = weight / (height / 100) ** 2;

  const mode = weight < idealMin ? 'gain'
             : weight > idealMax ? 'lose'
             : 'ok';

  const diff = mode === 'gain' ? idealMin - weight
             : mode === 'lose' ? weight - idealMax
             : 0;

  const months = diff > 0 ? Math.ceil(diff / CONFIG.ratePerMonth) : 0;

  return {
    weight,
    mode,
    diff,
    months,
    weeks: months * 4,
    idealMin,
    idealMax,
    bmi,
    bmiCat: bmiCategory(bmi),
    fatMass: weight * bodyfat / 100,
    muscleRatio: muscle / weight * 100,
  };
}


/* ============================================================
 * § 7  表单校验
 * ============================================================ */

/** 把 state.values 回填到表单控件 */
function syncForm() {
  const v = state.values;
  if (!v) return;

  const genderRadio = $(`input[name=gender][value=${v.gender}]`);
  if (genderRadio) genderRadio.checked = true;

  dom.height.value  = v.height;
  dom.weight.value  = v.weight;
  dom.bodyfat.value = v.bodyfat;
  dom.muscle.value  = v.muscle;
}

/** 显示错误并聚焦到对应输入框 */
function showError(key, input) {
  dom.err.textContent = I18N[state.lang][key] ?? key;
  dom.err.hidden = false;
  shake(dom.err);
  haptic([20, 40, 20]);

  if (input) {
    input.classList.add('bad');
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/** 清除所有错误状态 */
function clearErrors() {
  dom.err.hidden = true;
  for (const key of FIELD_ORDER) {
    const input = fieldInputs[key];
    input.classList.remove('bad');
    input.removeAttribute('aria-invalid');
  }
}

/**
 * 读取并校验表单
 * @returns {object|null} 合法数据对象，或 null（已展示错误）
 */
function readForm() {
  clearErrors();
  const values = {};

  for (const key of FIELD_ORDER) {
    const input = fieldInputs[key];
    const meta = FIELD_META[key];
    const num = parseFloat(input.value);
    values[key] = num;

    if (!Number.isFinite(num) || !meta.valid(num)) {
      showError(`err_${key}`, input);
      return null;
    }
  }

  /* 交叉校验：肌肉量必须小于总体重 */
  if (values.muscle >= values.weight) {
    showError('err_muscle_big', dom.muscle);
    return null;
  }

  values.gender = $('input[name=gender]:checked').value;
  return values;
}


/* ============================================================
 * § 8  结果渲染
 * ============================================================ */

/** 渲染整块结果区 */
function render() {
  const r = state.result;
  if (!r) return;

  const t = I18N[state.lang];

  /* —— R-1  BMI 卡片 —— */
  dom.bh.dataset.cat = r.bmiCat;
  dom.bhn.textContent = fmt1(r.bmi);
  dom.bhc.textContent = t[`bmi_${r.bmiCat}`];
  dom.bhr.textContent = t[`bmi_range_${r.bmiCat}`];

  const [scaleMin, scaleMax] = CONFIG.bmiScale;
  const bmiPercent = Math.min(97, Math.max(3,
    (r.bmi - scaleMin) / (scaleMax - scaleMin) * 100));
  dom.bsm.style.left = `${bmiPercent}%`;

  /* —— R-2  状态条 —— */
  dom.sts.dataset.s = r.mode;
  dom.stt.textContent = t[`status_${r.mode}`];
  dom.stsub.textContent = fill(t[`status_${r.mode}_sub`], {
    w: fmt1(r.weight),
    d: fmt1(r.diff),
  });

  /* 大号数字：只有需要增减时才显示 */
  if (r.mode === 'ok') {
    dom.std.hidden = true;
  } else {
    dom.std.hidden = false;
    dom.stdn.textContent = fmt1(r.diff);
    dom.stdu.textContent = 'kg';
  }

  /* —— R-3  体重位置滑轨 —— */
  const span = Math.max(r.idealMax - r.idealMin, 4);
  const pad = span * 1.2;
  const railMin = Math.max(0, r.idealMin - pad);
  const railMax = r.idealMax + pad;
  const railTotal = railMax - railMin;
  const toPercent = v => (v - railMin) / railTotal * 100;

  dom.rb.style.left  = `${toPercent(r.idealMin)}%`;
  dom.rb.style.width = `${toPercent(r.idealMax) - toPercent(r.idealMin)}%`;
  dom.rm.style.left  = `${Math.min(97, Math.max(3, toPercent(r.weight)))}%`;

  dom.cw.textContent   = fmt1(r.weight);
  dom.smin.textContent = `${Math.round(railMin)} kg`;
  dom.smax.textContent = `${Math.round(railMax)} kg`;

  /* —— R-4  指标网格 —— */
  dom.fm.textContent = fmt1(r.fatMass);
  dom.mr.textContent = fmt1(r.muscleRatio);
  dom.ir.textContent = `${fmt1(r.idealMin)} – ${fmt1(r.idealMax)}`;

  dom.tc.dataset.s = r.mode;
  if (r.mode === 'ok') {
    dom.tv.textContent = '—';
    dom.tu.textContent = '';
    dom.ts.textContent = t.time_ok;
  } else {
    dom.tv.textContent = String(r.months);
    dom.tu.textContent = t.time_unit_months;
    dom.ts.textContent = fill(t.time_sub_weeks, { weeks: r.weeks });
  }
}

/** 根据是否有结果，切换空状态 / 结果区可见性 */

}

/** 触发某个指标卡片的脉冲动画 */
function pulseCard(field) {
  const card =
    field === 'bodyfat' ? dom.cf :
    field === 'muscle'  ? dom.cm :
    field === 'weight'  ? dom.ci : null;
  if (!card) return;

  card.classList.remove('pulse');
  void card.offsetWidth; // 强制重排以重启动画
  card.classList.add('pulse');
}

/**
 * 展开某个胶囊的内联编辑器
 * @param {HTMLElement} chip
 * @param {string} field
 */
function openEditor(chip, field) {
  if (chip.classList.contains('edit')) return;

  const t = I18N[state.lang];
  const meta = FIELD_META[field];
  const current = state.values[field];

  chip.classList.add('edit');
  chip.removeAttribute('role');
  chip.removeAttribute('tabindex');
  chip.setAttribute('aria-label', `${t[meta.i18n]}: ${current} ${meta.unit}`);

  chip.innerHTML = `
    <div class="ed" role="group">
      <div class="edh">
        <span class="edl">${t[meta.i18n]}</span>
        <span class="edr">${fmtRange(meta.min, meta.max)} ${meta.unit}</span>
      </div>

      <div class="edf">
        <button type="button" class="eds" data-s="-1" aria-label="Decrease">−</button>
        <input class="edi" type="number" inputmode="decimal"
               step="${meta.step}" min="${meta.min}" max="${meta.max}"
               value="${current}" aria-label="${t[meta.i18n]}">
        <span class="edu">${meta.unit}</span>
        <button type="button" class="eds" data-s="1" aria-label="Increase">+</button>
      </div>

      <p class="ede" hidden></p>

      <div class="eda">
        <button type="button" class="edb g" data-a="cancel">${t.btn_cancel}</button>
        <button type="button" class="edb p" data-a="confirm">${t.btn_confirm}</button>
      </div>
    </div>`;

  const input = chip.querySelector('.edi');
  const errEl = chip.querySelector('.ede');

  requestAnimationFrame(() => {
    input.focus();
    input.select();
  });

  let settled = false;

  /* —— 校验当前输入值 —— */
  const validate = () => {
    const num = parseFloat(input.value);

    if (!Number.isFinite(num) || !meta.valid(num)) {
      errEl.textContent = fill(t.err_range, {
        min: meta.min, max: meta.max, unit: meta.unit,
      });
      errEl.hidden = false;
      input.classList.add('bad');
      shake(chip);
      haptic([20, 30, 20]);
      return null;
    }

    if (field === 'muscle' && num >= state.values.weight) {
      errEl.textContent = t.err_muscle_big;
      errEl.hidden = false;
      input.classList.add('bad');
      shake(chip);
      haptic([20, 30, 20]);
      return null;
    }

    errEl.hidden = true;
    input.classList.remove('bad');
    return num;
  };

  /* —— 确认修改 —— */
  const commit = () => {
    if (settled) return false;
    const num = validate();
    if (num == null) return false;

    settled = true;
    state.values = { ...state.values, [field]: num };
    syncForm();
    state.result = analyze(state.values);

    render();
    renderChip(dom.sbar.querySelector(`.chip[data-f="${field}"]`), field);
    pulseCard(field);
    haptic(10);
    return true;
  };

  /* —— 取消修改 —— */
  const cancel = () => {
    if (settled) return;
    settled = true;
    renderChip(chip, field);
    haptic(6);
  };

  /* 确认 / 取消 */
  chip.querySelector('[data-a=confirm]').addEventListener('click', commit);
  chip.querySelector('[data-a=cancel]').addEventListener('click', cancel);

  /* 加减按钮 */
  chip.querySelectorAll('.eds').forEach(btn => {
    btn.addEventListener('click', () => {
      const delta = Number(btn.dataset.s);
      const step = meta.step || 1;
      const currentVal = parseFloat(input.value);
      const base = Number.isFinite(currentVal) ? currentVal : 0;

      let next = base + delta * step;
      next = Math.round(next * 100) / 100;
      next = Math.min(meta.max, Math.max(meta.min, next));

      input.value = String(next);
      input.classList.remove('bad');
      errEl.hidden = true;
      haptic(5);
    });
  });

  /* 输入时清除错误 */
  input.addEventListener('input', () => {
    input.classList.remove('bad');
    errEl.hidden = true;
  });

  /* 键盘：Enter 确认 / Esc 取消 */
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      commit();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      cancel();
    }
  });

  /* 点击外部取消 */
  const onOutside = e => {
    if (!chip.contains(e.target)) {
      cancel();
      document.removeEventListener('pointerdown', onOutside, true);
    }
  };
  setTimeout(() => document.addEventListener('pointerdown', onOutside, true), 0);
}

/** 处理胶囊点击：性别直接切换，其余展开编辑器 */
function activateChip(chip) {
  if (!chip) return;

  /* 「完整编辑」→ 跳到输入页 */
  if (chip.dataset.a === 'edit') {
    haptic();
    goToView('input', true);
    return;
  }

  const field = chip.dataset.f;
  if (!field) return;

  /* 性别：点击即切换 */
  if (field === 'gender') {
    haptic();
    state.values = {
      ...state.values,
      gender: state.values.gender === 'female' ? 'male' : 'female',
    };
    syncForm();
    state.result = analyze(state.values);
    render();
    renderChip(chip, 'gender');
    haptic(8);
    return;
  }

  openEditor(chip, field);
}


/* ============================================================
 * § 10  视图 / 主题 / 语言
 * ============================================================ */

/** 切换视图，并恢复该视图上次的滚动位置 */
function goToView(view, smooth = false) {
  if (view === state.view) return;

  scrollMemory[state.view] = dom.body.scrollTop;
  state.view = view;

  for (const section of $$('.view')) {
    section.hidden = section.dataset.v !== view;
  }

  for (const tab of $$('.tab')) {
    const active = tab.dataset.t === view;
    tab.classList.toggle('on', active);
    tab.setAttribute('aria-selected', String(active));
  }

  /* 「分析」页有新结果时显示红点 */
  dom.badge.hidden = !(state.result && view !== 'results');

  dom.body.scrollTo({
    top: scrollMemory[view] ?? 0,
    behavior: smooth ? 'smooth' : 'instant',
  });
}

/** 同步主题按钮的无障碍属性与 meta 主题色 */
function syncThemeMeta() {
  const t = I18N[state.lang];
  const label = state.theme === 'dark' ? t.theme_light : t.theme_dark;

  dom.theme.setAttribute('aria-label', label);
  dom.theme.setAttribute('aria-pressed', String(state.theme === 'dark'));

  const meta = $('meta[name=theme-color]');
  if (meta) meta.content = state.theme === 'dark' ? '#0b1220' : '#10b981';
}

/** 应用当前语言的静态文案 */
function applyI18n() {
  const t = I18N[state.lang];

  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';

  for (const el of $$('[data-i]')) {
    const text = t[el.dataset.i];
    if (text != null) el.textContent = text;
  }

  for (const el of $$('[data-ph]')) {
    const text = t[el.dataset.ph];
    if (text != null) el.placeholder = text;
  }

  syncThemeMeta();

  if (state.values) buildChipBar();
}

function setLang(lang) {
  if (lang === state.lang) return;
  state.lang = lang;
  try { localStorage.setItem('sha-lang', lang); } catch {}

  applyI18n();
  if (state.result) render();
}

function setTheme(theme) {
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('sha-theme', theme); } catch {}
  syncThemeMeta();
}


/* ============================================================
 * § 11  事件绑定
 * ============================================================ */

/* —— 提交表单 → 分析 —— */
dom.form.addEventListener('submit', e => {
  e.preventDefault();
  const values = readForm();
  if (!values) return;

  state.values = values;
  state.result = analyze(values);

  buildChipBar();
  render();
  updateVisibility();
  goToView('results', true);
  haptic(12);
});

/* —— 清除全部数据 —— */
function clearAll() {
  document.activeElement?.blur?.();

  for (const key of FIELD_ORDER) fieldInputs[key].value = '';
  $('input[name=gender][value=female]').checked = true;

  clearErrors();

  state.values = null;
  state.result = null;

  dom.sbar.replaceChildren();
  dom.sbar.hidden = true;
  updateVisibility();
  dom.badge.hidden = true;

  goToView('input', true);
  haptic(10);
}
dom.clear.addEventListener('click', clearAll);

/* —— 胶囊条：点击 / 键盘 —— */
dom.sbar.addEventListener('click', e => {
  if (e.target.closest('.ed')) return;
  const chip = e.target.closest('.chip');
  if (chip) activateChip(chip);
});

dom.sbar.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const chip = e.target.closest('.chip');
  if (!chip || e.target.closest('.ed')) return;
  e.preventDefault();
  activateChip(chip);
});

/* —— 顶栏按钮 —— */
dom.lang.addEventListener('click', () => {
  haptic();
  setLang(state.lang === 'zh' ? 'en' : 'zh');
});

dom.theme.addEventListener('click', () => {
  haptic();
  setTheme(state.theme === 'dark' ? 'light' : 'dark');
});

/* —— 标签栏切换 —— */
for (const tab of $$('.tab')) {
  tab.addEventListener('click', () => {
    haptic();
    goToView(tab.dataset.t);
  });
}

/* —— 输入时即时清除错误 —— */
for (const key of FIELD_ORDER) {
  const input = fieldInputs[key];
  input.addEventListener('input', () => {
    input.classList.remove('bad');
    input.removeAttribute('aria-invalid');
    dom.err.hidden = true;
  });
}

/* —— 滚动时给顶栏加投影 —— */
dom.body.addEventListener('scroll', () => {
  dom.bar.classList.toggle('sc', dom.body.scrollTop > 4);
}, { passive: true });


/* ============================================================
 * § 12  初始化
 * ============================================================ */

syncThemeMeta();
applyI18n();
updateVisibility();
goToView('input');

</script>
</body>
